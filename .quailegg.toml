# Generated by qegg, then tuned for a live drill.
schema_version = 1

[project]
default_branch = "main"
repo = "github.com/SuperQuail/qegg-live-probe"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "commit"
github_release = true
commit_message = "chore(release): v{{version}}"

[changes]
dir = ".changes"
scope = ["main.go"]

[verify]
commands = ["go build ./..."]
timeout = "5m"
fail_fast = true
hook = false

[publish]
registries = ["go"]

[packages."github.com/SuperQuail/qegg-live-probe"]
name = "github.com/SuperQuail/qegg-live-probe"
path = "."
resolver = "go"
publish = true
